<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Event</title><link rel="stylesheet" href="../assets/style.css">
<script type="module" src="../assets/js/app.js"></script></head>
<body data-page="event-form">
<div id="site-nav"></div>
<div class="form-card"><h2 id="event-form-title">Create School Event</h2><form id="event-form"><label>Event Title</label><input name="title" required><label>Description</label><textarea name="description" required></textarea><label>Date</label><input type="date" name="event_date" required><label>Time</label><input type="time" name="event_time" required><label>Location</label><input name="location" required><label>Capacity</label><input type="number" name="capacity" min="1" required><br><br><button class="btn">Save Event</button></form></div>
<div id="toast" class="alert" hidden></div>
</body></html>
